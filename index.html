<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF-canvas sandbox</title>
    <link rel="stylesheet" href="src/style/style.css">
    <link rel="stylesheet" href="src/style/style-all-elements.css">
</head>

<body>
    <div id="compiling-screen">
        <div> Compiling... </div>
    </div>

    <canvas id="canvas"></canvas>
    <!--  <canvas id="canvas2"></canvas> -->

    <div id="all-types-container">
        <sdf-sphere class="test-sdf-sphere" data-render-layers="0 1" data-layer-index="1">Sphere</sdf-sphere>
        <sdf-box-simple id="test-sdf-box-simple" data-render-layers="0 1" data-layer-index="1">Simple
            Box</sdf-box-simple>
        <sdf-box id="test-sdf-box" data-render-layers="0" data-layer-index="1">Box with rounded corners</sdf-box>
        <sdf-box id="test-sdf-box-2" data-render-layers="0 1" data-layer-index="1">Box with rounded corners</sdf-box>
        <sdf-box-round id="test-sdf-box-round" data-render-layers="0 1" data-layer-index="1">Rounded box</sdf-box-round>
    </div>

    <sdf-text id="test-sdf-text" class="sdf-text" data-layer-index="1">.</sdf-text>
    <!--     <sdf-text class="sdf-text" data-layer-index="1">abcdefghijklmnopqrstuvwxyz</sdf-text>
 -->
    <sdf-box id="test-div" data-render-layers="0 1" data-layer-index="2">asdfasdf</sdf-box>

    <input type="text" id="myInput" name="name" />

    <!--     <sdf-box-simple id="background" data-layer-index="0"></sdf-box-simple>
 -->
    <div id="rect-vis"></div>

    <div id="fps-counter">10fps</div>

    <script src="src/scripts/sdf-elements.js" type="module"></script>
    <script src="src/scripts/sdf.js" type="module"></script>
</body>

</html>
