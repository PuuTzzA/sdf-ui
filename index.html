<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDF-canvas sandbox</title>
    <link rel="stylesheet" href="src/style/style.css">
    <link rel="stylesheet" href="src/style/style-all-elements.css">
</head>

<body>
    <div id="compiling-screen">
        <div> Compiling... </div>
    </div>

    <canvas id="canvas"></canvas>
    <!--  <canvas id="canvas2"></canvas> -->


    <div id="all-types-container">
        <sdf-sphere class="test-sdf-sphere" data-render-layers="0 1" data-layer-index="2">Sphere</sdf-sphere>
        <sdf-box-simple id="test-sdf-box-simple" data-render-layers="0 1" data-layer-index="2">Simple
            Box</sdf-box-simple>
        <sdf-box-simple id="test-sdf-box-simple" class="extrude" data-render-layers="0 1" data-layer-index="2">Simple
            Box with extrusion</sdf-box-simple>
        <sdf-box id="test-sdf-box" data-render-layers="0" data-layer-index="2">Box with rounded corners</sdf-box>
        <sdf-box id="test-sdf-box-2" data-render-layers="0 1" data-layer-index="2">Box with rounded corners</sdf-box>
        <sdf-cylinder id="test-sdf-cylinder" data-render-layers="0 1" data-layer-index="2">Cylinder</sdf-cylinder>
        <sdf-triangle id="test-sdf-triangle" data-render-layers="0 1" data-layer-index="2">Triangle</sdf-triangle>
    </div>

    <sdf-text id="test-sdf-text" class="sdf-text" data-render-layers="0" data-layer-index="2">test </sdf-text>
    <!--     <sdf-text class="sdf-text" data-layer-index="1">abcdefghijklmnopqrstuvwxyz</sdf-text>
 -->
    <sdf-light class="light" id="light-1">A</sdf-light>
    <sdf-light class="light" id="light-2">A</sdf-light>

    <sdf-box id="test-div" data-render-layers="0 1" data-layer-index="2">
    </sdf-box>

    <div id="target"></div>

    <div id="my-input-container">
        <input type="text" id="my-input" name="name" />
    </div>

    <!--     <sdf-box-simple id="background" data-layer-index="0"></sdf-box-simple>
 -->
    <div id="rect-vis"></div>

    <div id="fps-counter">10fps</div>

    <script src="src/scripts/sdf-elements.js" type="module"></script>
    <script src="src/scripts/sdf.js" type="module"></script>
</body>

</html>
